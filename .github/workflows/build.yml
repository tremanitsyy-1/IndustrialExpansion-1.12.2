name: Build Industrial Expansion 1.12.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Unpack project
        shell: bash
        run: |
          cat chunks/v02_00.txt chunks/v02_01.txt chunks/v02_02.txt chunks/v02_03.txt chunks/v02_04.txt > project-v02.b64
          base64 -d project-v02.b64 > project.tar.gz
          gzip -t project.tar.gz
          tar -xzf project.tar.gz
          rm project-v02.b64 project.tar.gz

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Show built files
        if: always()
        run: find build -maxdepth 3 -type f -print || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialExpansion-1.12.2-0.2.0
          path: build/libs/*.jar
          if-no-files-found: error
